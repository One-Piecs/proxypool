name: Build Multi-arch Docker Image

on:
  release:
    types: [published]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/proxypool

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest using buildx
        run: |
          # 使用 buildx imagetools 创建多架构清单
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64
          
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64

      - name: Verify multi-arch manifest
        run: |
          echo "Verifying multi-arch manifest for version tag:"
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          
          echo "Verifying multi-arch manifest for latest tag:"
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest

  cleanup-tags:
    runs-on: ubuntu-latest
    needs: create-manifest
    steps:
      - name: Install necessary tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Clean up temporary architecture tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # 获取 JWT token
          echo "Getting Docker Hub JWT token..."
          TOKEN_RESPONSE=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            -d '{"username": "'"$DOCKERHUB_USERNAME"'", "password": "'"$DOCKERHUB_TOKEN"'"}' \
            https://hub.docker.com/v2/users/login/)
          
          JWT_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.token')
          
          if [ "$JWT_TOKEN" = "null" ] || [ -z "$JWT_TOKEN" ]; then
            echo "Failed to get JWT token"
            echo "Response: $TOKEN_RESPONSE"
            exit 1
          fi
          
          echo "Successfully obtained JWT token"
          
          # 删除临时标签的函数
          delete_tag() {
            local tag=$1
            echo "Deleting tag: $tag"
          
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: JWT $JWT_TOKEN" \
              -X DELETE \
              "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/proxypool/tags/$tag/")
          
            if [ "$response" = "204" ]; then
              echo "✓ Successfully deleted tag: $tag"
            else
              echo "✗ Failed to delete tag: $tag (HTTP $response)"
            fi
          }
          
          # 删除临时架构标签
          delete_tag "${VERSION}-amd64"
          delete_tag "${VERSION}-arm64"
          
          echo "Cleanup completed successfully"


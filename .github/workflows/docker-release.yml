name: Build Multi-arch Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/proxypool

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_suffix: arm64
    
    outputs:
      image_meta: ${{ steps.meta.outputs.json }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.arch_suffix }},onlatest=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Create and push manifest
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          SOURCE_IMAGE="${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          
          for tag in $TAGS; do
            echo "Creating manifest for $tag..."
            docker buildx imagetools create -t "$tag" \
              "${SOURCE_IMAGE}-amd64" \
              "${SOURCE_IMAGE}-arm64"
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Install cleanup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Clean up temporary architecture tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "Getting Docker Hub JWT token..."
          TOKEN_RESPONSE=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\": \"$DOCKERHUB_USERNAME\", \"password\": \"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/)

          JWT_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.token')

          if [ "$JWT_TOKEN" = "null" ] || [ -z "$JWT_TOKEN" ]; then
            echo "Failed to get JWT token"
            exit 1
          fi

          echo "Successfully obtained JWT token"

          delete_tag() {
            local tag=$1
            echo "Deleting tag: $tag"
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: JWT $JWT_TOKEN" \
              -X DELETE \
              "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/proxypool/tags/$tag/")
            
            if [ "$response" = "204" ]; then
              echo "✓ Successfully deleted tag: $tag"
            else
              echo "✗ Failed to delete tag: $tag (HTTP $response)"
            fi
          }

          delete_tag "${VERSION}-amd64"
          delete_tag "${VERSION}-arm64"

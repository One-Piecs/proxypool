name: Build Multi-arch Docker Image

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/proxypool

# 同一 ref 的并发运行取消旧任务，避免重复触发时浪费构建资源
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run vet & tests
        run: |
          go vet ./...
          go test ./... 2>&1 | tail -30

      - name: Build binaries (amd64 + arm64)
        run: |
          # 并行交叉编译两个平台，全部完成后继续
          make linux-amd64 &
          make linux-armv8 &
          wait
          # 重命名以匹配 Dockerfile.release 中的 TARGETARCH 命名规范
          mv bin/proxypool-linux-armv8 bin/proxypool-linux-arm64
          ls -lh bin/proxypool-linux-*

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
